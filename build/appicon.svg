<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
  <!-- opsbox logo：本地运维工具箱 —— 终端窗口 + 命令提示符，窗口三色圆点与三模块（SSH/SQL/Redis）呼应 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#15334E"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底板 -->
  <rect x="24" y="24" width="632" height="632" rx="144" fill="url(#bg)"/>

  <!-- 终端窗口卡片 -->
  <rect x="132" y="176" width="416" height="328" rx="36" fill="#152A42" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="3"/>
  <!-- 标题栏：三色圆点（mac 风格窗口钮，亦呼应三模块） -->
  <circle cx="178" cy="222" r="13" fill="#F87171"/>
  <circle cx="210" cy="222" r="13" fill="#FBBF24"/>
  <circle cx="242" cy="222" r="13" fill="#34D399"/>
  <line x1="132" y1="252" x2="548" y2="252" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="3"/>

  <!-- 命令提示符 > 与光标 _ -->
  <polyline points="196,318 258,378 196,438" fill="none" stroke="#22D3EE" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="296" y="410" width="112" height="32" rx="16" fill="#E2E8F0"/>
</svg>
